plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

if (!build16) {
    sourceSets.main.java.exclude "ca/fxco/memoryleakfix/mixin/hugeScreenshotLeak/*", "ca/fxco/memoryleakfix/mixin/tagKeyLeak/*"
}

loom {
    // accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    // modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    // Remove the next line if you don't want to depend on the API
    // modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

    // MixinExtras
    annotationProcessor(implementation("io.github.llamalad7:mixinextras-fabric:${rootProject.mixinextras_version}"))
}

processResources {
    def commonMixinId = "memoryleakfix" + (build16 ? "-16" : "")
    def resInputs = [version: project.version, commonMixinId: commonMixinId]
    inputs.properties(resInputs)

    filesMatching("fabric.mod.json") {
        expand(resInputs)
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    classifier "dev-shadow"
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    classifier null
}

def verifyMixinRefmap = tasks.register("verifyMixinRefmap") {
    group = "verification"
    description = "Verify that the runtime common mixins load their generated intermediary refmap."
    dependsOn tasks.named("remapJar")
    inputs.file(tasks.named("remapJar").flatMap { it.archiveFile })

    doLast {
        def jarFile = tasks.named("remapJar").get().archiveFile.get().asFile
        new java.util.zip.ZipFile(jarFile).withCloseable { jar ->
            def readJson = { String path ->
                def entry = jar.getEntry(path)
                if (entry == null) {
                    throw new GradleException("Missing ${path} in ${jarFile.name}")
                }
                jar.getInputStream(entry).withCloseable { stream ->
                    new groovy.json.JsonSlurper().parse(stream, "UTF-8")
                }
            }
            String commonMixin = "memoryleakfix${build16 ? '-16' : ''}.mixins.json"
            def registeredMixins = readJson("fabric.mod.json").mixins.collect {
                it instanceof String ? it : it.config
            }
            if (!registeredMixins.contains(commonMixin)) {
                throw new GradleException("${commonMixin} is not registered in fabric.mod.json")
            }
            def config = readJson(commonMixin)
            if (!(config.refmap instanceof String) || config.refmap.isEmpty()) {
                throw new GradleException("${commonMixin} does not declare its common refmap")
            }
            def refmap = readJson(config.refmap)
            def mappings = refmap.mappings
            def intermediaryMappings = refmap.data?.get("named:intermediary")
            if (!(mappings instanceof Map) || mappings.isEmpty() || intermediaryMappings != mappings) {
                throw new GradleException("${config.refmap} has no consistent intermediary mappings")
            }
            if (!build16) {
                def screenshot = mappings["ca/fxco/memoryleakfix/mixin/hugeScreenshotLeak/Minecraft_screenshotMixin"]
                if (screenshot?.get("grabHugeScreenshot") != "Lnet/minecraft/class_310;method_35699(Ljava/io/File;IIII)Lnet/minecraft/class_2561;" ||
                        screenshot?.get("Lcom/mojang/blaze3d/platform/GlUtil;allocateMemory(I)Ljava/nio/ByteBuffer;") != "Lnet/minecraft/class_4494;method_35611(I)Ljava/nio/ByteBuffer;") {
                    throw new GradleException("${config.refmap} is missing the hugeScreenshotLeak intermediary targets")
                }
            }
            logger.lifecycle("Verified ${commonMixin} -> ${config.refmap} in ${jarFile.name}")
        }
    }
}

tasks.named("check") {
    dependsOn verifyMixinRefmap
}

jar {
    classifier "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
